name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release-tools
      - run: node --test scripts/npm-publish.test.mjs
      - run: npm run check:package
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

  browser:
    name: DSH ${{ matrix.dsh }} browser acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.0-rc.2', '0.2.1-rc.2', '0.2.1-rc.5']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --prefix "$env:RUNNER_TEMP/dsh-runtime" --no-audit --no-fund --save-exact "@deepseek-ai/dsh@${{ matrix.dsh }}"
      - run: npm run test:e2e
        env:
          DSH_QA_MODULES: ${{ runner.temp }}/dsh-runtime/node_modules
