name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:release-tools
      - run: node --test scripts/npm-publish.test.mjs
      - run: npm run check:package
      - name: Ensure checks did not modify tracked files
        run: git diff --exit-code

  browser:
    name: DSH ${{ matrix.dsh }} / Node ${{ matrix.node }} browser acceptance
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - dsh: '0.2.0-rc.2'
            node: 22
          - dsh: '0.2.1-rc.2'
            node: 22
          - dsh: '0.2.1-rc.5'
            node: 22
          - dsh: '0.2.2-rc.1'
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install packed plugin with strict host peers
        run: |
          npm pack --pack-destination "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          npm install --prefix "$env:RUNNER_TEMP/dsh-runtime" --strict-peer-deps --no-audit --no-fund --save-exact "@deepseek-ai/dsh@${{ matrix.dsh }}" "$env:RUNNER_TEMP/dsh-plugin-no-workspace-$version.tgz"
      - run: npm run test:e2e
        env:
          DSH_QA_MODULES: ${{ runner.temp }}/dsh-runtime/node_modules
